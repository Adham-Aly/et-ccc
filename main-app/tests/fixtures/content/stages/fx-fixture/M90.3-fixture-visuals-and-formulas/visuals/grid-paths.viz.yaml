layout: single
panels:
  - { id: t, viz: TableViz }
alt: >-
  A table counting the routes from the top-left cell of a grid to every other cell, moving only
  right or down. The top row and left column hold 1; every other cell adds the cell above it and
  the cell to its left.
captions: vizrec
presets:
  - { id: small, label: "3 × 4", stdin: "3 4\n" }
  - { id: large, label: "4 × 5", stdin: "4 5\n" }
consistency:
  description: The bottom-right value equals the output of examples/grid_paths.py.
  example: ../examples/grid_paths.py
  compare: output
