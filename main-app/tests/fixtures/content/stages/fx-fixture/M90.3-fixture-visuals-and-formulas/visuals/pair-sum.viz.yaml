layout: single
panels:
  - { id: a, viz: ArrayViz }
alt: >-
  Two pointers on a sorted list. lo starts at the left end and hi at the right end. When their
  sum is too small, lo moves right; when it is too big, hi moves left; they stop at a pair with
  the target sum or when they meet.
captions: vizrec
presets:
  - { id: found, label: "Target 13", stdin: "7 13\n1 3 4 6 8 9 11\n" }
  - { id: none, label: "Target 6", stdin: "5 6\n1 2 7 8 9\n" }
consistency:
  description: The pair the visual stops at (or none) equals the output of examples/pair_sum.py.
  example: ../examples/pair_sum.py
  compare: output
