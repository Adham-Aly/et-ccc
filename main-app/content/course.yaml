# content/course.yaml — P4 skeleton, P5 finalises (brief §2 A5).
#
# Ordered stages -> modules. IDs and titles from research/01-recon/curriculum-map.md
# (M0.2 and M0.3 dropped as setup-only content, C21/D-030 Q-19; M7.14 kept, D-030 Q-10).
# Every module starts "planned" (renders as "Coming soon", no link, plan §4.1 draft visibility)
# until P5-P8 write it. Stage and module "goal"/"title" text here is neutral and score-free by
# hand (plan §5.4): the source recon file's "Goal / exit criterion" and "Contest payoff" columns
# were NOT copied, since they contain score/CCO/medal wording the app must never show (R14).
#
# prereqs are module ids only, resolved and checked acyclic by content:check (G-SCHEMA). A few
# prereqs that named non-module text in the source ("Stage 6 complete", "the module that
# introduces each template", "Stage 3 for Junior mocks; Stage 5+ for Senior mocks") were mapped
# by hand to the nearest concrete module id, or left empty when no single id fits (C.1, C.3) —
# P5 may refine these once it writes the modules themselves.

