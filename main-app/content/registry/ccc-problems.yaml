# content/registry/ccc-problems.yaml — P4 skeleton, P5 finalises (brief §2 A5).
#
# One entry per unique CCC problem, 2014-2026 (119 total, plan §4.7). id is the derived judge
# slug (never hand-typed elsewhere — judgeUrl() in lib/registry/judge-url.ts is the only place
# that builds a URL from it, R13/D-020). A crossover problem (hosted once, under its Senior
# slug — plan §4.7) carries its Junior "aliases" entry; there is no separate Junior registry row
# for it, by design (G-SCHEMA checks there is no duplicate).
#
# Titles are provisional, taken only from research/01-recon/past-problems-analysis.md (the id,
# year, level, number and title columns only — NOT the Diff/Py-verdict/Cheap-partial-route
# columns, which contain the kind of solution/score framing the app must never show, R14/C20).
# topics, modules and the subtask outline are P5's job. "internal" is never rendered (G-SCHEMA).

