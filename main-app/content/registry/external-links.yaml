# content/registry/external-links.yaml — allow-list of non-judge external links (plan §4.7,
# G-LINK-FMT). Judge links never appear here: they come only from judgeUrl() (lib/registry).
# Anything an MDX lesson or a component links to outside the origin must resolve to one of these
# entries by id; content:check fails a raw external URL that is not on this list.

links:
  - id: python-docs
    label: The Python documentation
    url: https://docs.python.org/3/
  - id: python-tutorial
    label: The Python tutorial
    url: https://docs.python.org/3/tutorial/
  - id: cemc-ccc
    label: The CCC contest page (CEMC)
    url: https://cemc.uwaterloo.ca/contests/ccc
  - id: cemc-past-contests
    label: Past CCC contests (CEMC)
    url: https://cemc.uwaterloo.ca/resources/past-contests
  # pypy-downloads / python-downloads removed (design-review.md A1-3, C21): the app has no
  # install or setup content, so it never links a download page. Added to the G-R14 banned-URL
  # list instead, so a future lesson can't reintroduce one.
  - id: wmoj-home
    label: WMOJ
    url: https://wmoj.ca/
  # /user/register 404s live (design-review.md A1-1); /auth/register also 404s; /auth/signup is
  # the one that returns 200 (checked directly, work/04-app/external-links-run-1.md).
  - id: wmoj-signup
    label: WMOJ sign-up
    url: https://wmoj.ca/auth/signup
  - id: dmoj-home
    label: DMOJ
    url: https://dmoj.ca/
  # DMOJ sits behind Cloudflare, so this isn't live-checkable from a script (design-review.md
  # A1-1); /accounts/register/ is DMOJ's Django URL convention (its own source uses
  # django.contrib.auth-style routes) and replaces the guessed /register/. Added to the Manager's
  # manual DMOJ checklist (work/04-app/dmoj-checklist.html) pending confirmation.
  - id: dmoj-signup
    label: DMOJ sign-up
    url: https://dmoj.ca/accounts/register/
